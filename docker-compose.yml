services:
  web:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DJANGO_DEBUG: "true"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-django-insecure-local-development-only}
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
    volumes:
      - .:/app
    command: >
      uv run python manage.py runserver 0.0.0.0:8000
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health/', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
