[project]
name = "django-redis-demo"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "django>=5.2,<6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-cov>=7.1.0",
    "pytest-django>=4.8,<5.0",
    "taskipy>=1.12,<2.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "django_redis_demo.settings"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
testpaths = ["tests"]

[tool.coverage.run]
omit = ["django_redis_demo/wsgi.py"]

[tool.taskipy.tasks]
makemigrations = "python manage.py makemigrations"
migrate = "python manage.py migrate"
run = "python manage.py runserver"
test = "pytest"
test-cov = "pytest --cov=django_redis_demo --cov-report=term-missing --cov-fail-under=90 -v"
docker-makemigrations = "docker compose run --rm web uv run task makemigrations"
docker-migrate = "docker compose run --rm web uv run task migrate"
docker-run = "docker compose up --build"
docker-test = "docker compose run --rm web uv run task test"
docker-test-cov = "docker compose run --rm web uv run task test-cov"
